.logo{display:inline-block;flex:none;background:center/contain no-repeat;width:56px;height:56px}
.logo.h{background-image:var(--logo-h);width:52px;height:57px;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--atp) 55%,transparent))}
.logo.a{background-image:var(--logo-a);background-color:#fff;background-size:80%;border-radius:12px;width:62px;height:52px;box-shadow:0 0 0 2px var(--dural),0 0 16px color-mix(in srgb,var(--dural) 55%,transparent)}
.clubtot .top-row{display:flex;align-items:center;gap:12px}
.clubtot .logo.h{width:40px;height:44px} .clubtot .logo.a{width:52px;height:44px}
.tvscore .logo.h{width:calc(4.6*var(--u));height:calc(5*var(--u))} .tvscore .logo.a{width:calc(5.6*var(--u));height:calc(4.7*var(--u));border-radius:calc(.7*var(--u))}
@media (max-width:520px){.board .logo.h{width:38px;height:42px} .board .logo.a{width:48px;height:40px}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--atp);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.atp{color:var(--atp)} .dural{color:var(--dural)}

/* header */
.top{background:linear-gradient(105deg,var(--atp-band) 0%,var(--surface) 42%,var(--surface) 58%,var(--dural-band) 100%);border-bottom:3px solid var(--lime)}
.top .wrap{padding-block:18px 0;display:grid;gap:14px}
.headrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.top .eyebrow{color:var(--lime)}
h1{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(30px,5vw,46px);line-height:1;margin:4px 0 0;text-wrap:balance;letter-spacing:.01em}
h1 .atp,.top .club.atp b{color:#fff;text-shadow:0 0 18px color-mix(in srgb,var(--atp) 70%,transparent)}
h1 .dural,.top .club.dural b{color:#fff;text-shadow:0 0 18px color-mix(in srgb,var(--dural) 70%,transparent)}
h1 .vs{color:var(--lime);font-weight:800;font-size:.75em;margin:0 .3em}
.board{display:flex;align-items:center;gap:14px;font-family:var(--display)}
.board .club{display:grid;justify-items:center;line-height:1}
.board .club b{font-size:44px;font-weight:700}
.board .club span{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--body);font-weight:700}
.board .club.atp span{color:var(--atp)} .board .club.dural span{color:var(--dural)}
.board .dash{font-size:30px;color:var(--lime)}
.board .note{font-family:var(--body);font-size:12px;color:var(--muted);max-width:9em;line-height:1.25}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:-3px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs .tvbtn{margin-left:auto;color:var(--lime)}

main .wrap{padding-block:20px 120px;display:grid;gap:22px}
.banner{border-radius:8px;padding:10px 14px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.banner.info{background:var(--atp-soft);border:1px solid color-mix(in srgb,var(--atp) 30%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px}
.btn.primary{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn:disabled{opacity:.5;cursor:default}

/* rounds */
.round{display:grid;gap:12px}
.roundhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.roundhead h2{font-family:var(--display);font-size:30px;margin:0;font-weight:800;font-style:italic;text-transform:uppercase;color:var(--lime)}
.roundhead .times{color:var(--muted)}
.pill{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-radius:99px;padding:3px 9px}
.pill.live{background:var(--live-soft);color:var(--live)}
.pill.done{background:var(--sunk);color:var(--muted)}
.pill.next{background:var(--warn-soft);color:var(--warn)}
.divlabel{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted);margin-top:4px}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:420px){.matches{grid-template-columns:1fr}}
.match{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.match.isLive{border-color:var(--live);box-shadow:0 0 0 1px var(--live)}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.court{font-family:var(--display);font-weight:700;background:var(--gold);color:var(--on-lime);border-radius:6px;padding:2px 8px;font-size:18px;line-height:1.2;white-space:nowrap}
.court select{background:transparent;border:0;color:inherit;font-weight:700;padding:0;cursor:pointer}
.court select option{color:#111}
.teams{flex:1;min-width:0;font-weight:600;line-height:1.2}
.teams .v{color:var(--muted);font-weight:500;margin:0 4px}
.tie{font-family:var(--display);font-size:22px;font-weight:700;white-space:nowrap}
.game{display:grid;grid-template-columns:52px 1fr auto 1fr;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.mhead + .game{border-top:0}
.game.cur{background:var(--live-soft)}
.game .t{color:var(--muted);font-size:12px;line-height:1.15}
.game .t b{display:block;color:var(--ink);font-size:13px}
.pair{min-width:0;line-height:1.2}
.pair.away{text-align:right}
.pair .pn{display:block;font-weight:600;font-size:14px}
.pair.home .pn{color:var(--atp)} .pair.away .pn{color:var(--dural)}
.cap{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;background:var(--gold);color:var(--on-lime);font:800 .68em/1 var(--body);font-style:normal;margin-left:.4em;vertical-align:.12em}
.score{font-family:var(--display);font-size:22px;font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center;min-width:76px}
.score .w{color:var(--ink)} .score .l{color:var(--muted);font-weight:500}
.score .win-h,.score .win-a{border-radius:6px;padding:0 7px;min-width:1.6em;text-align:center}
.score .win-h{color:var(--atp);background:var(--atp-soft);box-shadow:inset 0 0 0 1px var(--atp)}
.score .win-a{color:var(--dural);background:var(--dural-soft);box-shadow:inset 0 0 0 1px var(--dural)}
.score .blank{color:var(--muted);font-weight:500;font-size:16px}
.score input{width:46px;text-align:center;font-family:var(--display);font-size:20px;font-weight:700;border:1px solid var(--line);border-radius:6px;background:var(--sunk);padding:2px}
.score input.changed{border-color:var(--warn);background:var(--warn-soft)}
/* narrow cards (phones, and the 3-across grid on computers): game label on top, each pair on its own line, score on the right */
.match{container-type:inline-size}
.game.ghead{display:none}
@container (max-width:480px){
  .game.ghead{display:grid;grid-template-areas:". s";padding-top:6px;padding-bottom:0;border-top:0}
  .game.ghead .score{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .game.ghead .score span:not(.dash){width:46px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .game.ghead .dash{visibility:hidden}
  .mhead + .game.ghead + .game{border-top:0}
  .game{grid-template-columns:1fr auto;grid-template-areas:"t t" "h s" "a s"}
  .game .t{grid-area:t} .game .home{grid-area:h} .game .away{grid-area:a;text-align:left} .game .score{grid-area:s}
}

/* tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}

import { getFirestore, doc, onSnapshot, setDoc, updateDoc, getDoc, deleteField, FieldPath } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, EVENT_ID } from "./firebase-config.js";

const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ss = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const DEFAULTS = JSON.parse($("#defaults").textContent);
const clone=o=>JSON.parse(JSON.stringify(o));
let SERVER=null, S=clone(DEFAULTS), loaded=false, missing=false, configError="";
const LETTERS = ["A","B","C"];
const PAIRS = [[0,1],[0,2],[1,2]];
const ROUNDS = 3, MPR = 3, DB = ROUNDS+1;  // DB = the dreambreaker that follows the last round

/* ----- fill defaults (example names) ----- */
function ensure(){
  S.divisions.forEach((d,di)=>{
    ["h","a"].forEach(side=>{
      for(let n=1;n<=3;n++){
        const k=`${d.id}-${side}${n}`;
        if(!S.teams[k]) S.teams[k]={name:`${S.clubs[side].short} Team ${n}`,players:LETTERS.map(l=>`Player ${l}`)};
      }
    });
    for(let r=1;r<=ROUNDS;r++)for(let m=1;m<=MPR;m++){
      const mk=`${d.id}-r${r}-m${m}`;
      if(S.courts[mk]==null) S.courts[mk]=di*MPR+m;
    }
  });
  S.divisions.forEach((d,di)=>{const k=`db-${d.id}`; if(S.courts[k]==null) S.courts[k]=di+1;});
  S.event.arrive??="08:00"; S.event.briefing??="08:20";
  if(S.demo && !Object.keys(S.scores).length){
    const demo=[[11,8],[7,12],[13,10],[9,9],[12,6],[10,11],[14,9],[8,13],[11,10],[12,12],[6,13],[11,9],[10,8],[9,12],[13,11],[12,9],[8,10],[11,7]];
    let i=0;
    S.divisions.forEach(d=>{for(let m=1;m<=MPR;m++)for(let g=1;g<=3;g++){S.scores[`${d.id}-r1-m${m}-g${g}`]=demo[i++%demo.length];}});
  }
}
ensure();

/* ----- draw ----- */
function matches(){
  const out=[];
  S.divisions.forEach((d,di)=>{
    for(let r=1;r<=ROUNDS;r++)for(let m=1;m<=MPR;m++){
      const away=((m-1+(r-1))%3)+1;
      out.push({key:`${d.id}-r${r}-m${m}`,div:d,di,r,m,h:`${d.id}-h${m}`,a:`${d.id}-a${away}`,court:S.courts[`${d.id}-r${r}-m${m}`]});
    }
  });
  return out;
}
const gkey=(mk,g)=>`${mk}-g${g}`;
const sc=(mk,g)=>{const v=S.scores[gkey(mk,g)];return Array.isArray(v)&&v[0]!=null&&v[1]!=null&&v[0]!==""&&v[1]!==""?[+v[0],+v[1]]:null};
const pairNames=(tk,g)=>{const t=S.teams[tk];const[p,q]=PAIRS[g-1];return [t.players[p],t.players[q]]};
const pnp=(tk,i)=>esc(S.teams[tk].players[i]);   // name without the captain badge (dreambreakers)
const pn=(tk,i)=>`${esc(S.teams[tk].players[i])}${i===0?`<span class="cap" title="Captain">C</span>`:""}`;
const pairHTML=(tk,g)=>{const[p,q]=PAIRS[g-1];return `<span class="pn">${pn(tk,p)}</span><span class="pn">${pn(tk,q)}</span>`};
const pairLabel=g=>{const[p,q]=PAIRS[g-1];return `${p+1} & ${q+1}`};

/* ----- time ----- */
const E=()=>S.event;
const roundLen=()=>3*E().gameMin+2*E().gapMin;
function baseTs(){
  const d=E().date||(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`})();
  const t=new Date(`${d}T${E().start||"09:00"}`).getTime();
  return isNaN(t)?Date.now():t;
}
function roundStarts(){
  const out=[];
  for(let r=0;r<ROUNDS;r++){
    const o=S.roundStart?.[r+1];
    out.push(o!=null?o:(r===0?baseTs():out[r-1]+(roundLen()+E().breakMin)*60000));
  }
  return out;
}
const nowT=()=>S.pausedAt!=null?S.pausedAt:Date.now();
const gameStart=(r,g)=>roundStarts()[r-1]+(g-1)*(E().gameMin+E().gapMin)*60000;
const fmtT=ts=>new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
function timeOn(hhmm){const d=new Date(baseTs());const [h,m]=String(hhmm||"0:0").split(":").map(Number);d.setHours(h||0,m||0,0,0);return d.getTime()}
function dbStart(){return S.roundStart?.[DB]!=null?S.roundStart[DB]:roundStarts()[ROUNDS-1]+(roundLen()+E().breakMin)*60000}
const DB_TO=25, DB_FREEZE=21, DB_EVERY=5;
function dbScore(d){const v=S.scores[`db-${d.id}-g1`];return [+(v?.[0]||0),+(v?.[1]||0)]}
function dbFinished(d){return Math.max(...dbScore(d))>=DB_TO}
function dbDone(){return S.divisions.every(dbFinished)}
// which pair is on court: both players swap every 5 points (total of both teams) until a team reaches 21
function dbIdx(d){const k=`db-${d.id}`,[h,a]=dbScore(d);if(S.dbIdx&&S.dbIdx[k]!=null)return S.dbIdx[k];return Math.floor((h+a)/DB_EVERY)}
function dbPair(d,side,idx){const o=dbOrder(d,side),n=o.length;return [o[(2*idx)%n],o[(2*idx+1)%n]]}
function dbInfo(d){
  const [h,a]=dbScore(d), idx=dbIdx(d), frozen=Math.max(h,a)>=DB_FREEZE, over=Math.max(h,a)>=DB_TO;
  const toSwap=frozen?null:DB_EVERY-((h+a)%DB_EVERY);
  return {h,a,idx,frozen,over,toSwap,winner:over?(h>a?"h":"a"):null};
}
// swap alert: on the point that makes the total a multiple of 5 (until the next point is scored);
// warning: on the point before a swap. Neither shows once a team has reached 21.
function dbAlert(d,i){
  const tot=i.h+i.a, live=!i.over&&!i.frozen&&tot>0;
  return {swapping:live&&tot%DB_EVERY===0, warn:live&&tot%DB_EVERY===DB_EVERY-1};
}
function dbPoint(divId,side,delta){
  const d=S.divisions.find(x=>x.id===divId); if(!d)return;
  const k=`db-${divId}`, gk=`${k}-g1`; let [h,a]=dbScore(d);
  if(delta>0&&Math.max(h,a)>=DB_TO)return;
  if(side==="h")h=Math.max(0,h+delta); else a=Math.max(0,a+delta);
  S.scores[gk]=[h,a]; S.dbIdx={...(S.dbIdx||{})};
  const prev=dbIdx(d);
  if(Math.max(h,a)<DB_FREEZE) S.dbIdx[k]=Math.floor((h+a)/DB_EVERY);
  else if(delta<0) S.dbIdx[k]=Math.min(prev,Math.floor((h+a)/DB_EVERY)); // keep the frozen pair
  else S.dbIdx[k]=prev;
}
// dreambreaker rotation: Team 1 players, then Team 2, then Team 3
function dbOrder(d,side){
  const out=[];for(let n=1;n<=3;n++){const tk=`${d.id}-${side}${n}`;S.teams[tk].players.forEach((_,i)=>out.push([tk,i]))}
  const cust=S.dbOrder&&S.dbOrder[`${d.id}-${side}`];   // randomised order, stored as positions in the team order
  return cust&&cust.length===out.length?cust.map(j=>out[j]):out;
}
function dbShuffle(divId){
  const mix=n=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const d=S.divisions.find(x=>x.id===divId); S.dbOrder={...(S.dbOrder||{})};
  ["h","a"].forEach(sd=>{S.dbOrder[`${divId}-${sd}`]=mix(9)});
  delete (S.dbIdx||{})[`db-${divId}`];
}
function phase(t=nowT()){
  const st=roundStarts(), gm=E().gameMin, gp=E().gapMin, rl=roundLen();
  const dbManual=S.roundStart?.[DB];
  if(dbManual!=null&&t>=dbManual) return dbDone()?{kind:"done",round:DB,game:1}:{kind:"db",round:DB,game:1};
  // nothing happens until a committee member starts a round (usually round 1)
  const started=[1,2,3].some(r=>S.roundStart?.[r]!=null);
  if(!started) return {kind:"pre",round:1,game:1,until:st[0]};
  // the round in play is the latest one whose start has passed, so "Start round 2 now" works even if round 1 is still on the clock
  let r=-1; for(let i=0;i<ROUNDS;i++) if(t>=st[i]) r=i;
  if(r<0) return {kind:"pre",round:1,game:1,until:st[0]};
  const rs=st[r], re=rs+rl*60000;
  if(t<re){
    const off=(t-rs)/60000; let g=Math.floor(off/(gm+gp)); if(g>2)g=2;
    const into=off-g*(gm+gp);
    if(into<gm) return {kind:"game",round:r+1,game:g+1,until:rs+(g*(gm+gp)+gm)*60000};
    return {kind:"gap",round:r+1,game:g+2,until:rs+((g+1)*(gm+gp))*60000};
  }
  if(r<ROUNDS-1) return {kind:"brk",round:r+2,game:1,until:st[r+1]};
  const ds=dbStart();
  if(t<ds) return {kind:"brk",round:DB,game:1,until:ds};
  if(!dbDone()) return {kind:"db",round:DB,game:1};
  return {kind:"done",round:DB,game:1};
}
function roundStatus(r){
  const p=phase();
  if(p.kind==="done"||r<p.round) return "done";
  if(r===p.round && (p.kind==="game"||p.kind==="gap")) return "live";
  if(r===p.round) return "next";
  return "later";
}
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`};

/* ----- stats ----- */
function stats(){
  const team={},player={},club={h:{w:0,d:0,l:0,pf:0,pa:0,byDiv:{}},a:{w:0,d:0,l:0,pf:0,pa:0,byDiv:{}}};
  const T=k=>team[k]??=({k,w:0,d:0,l:0,pf:0,pa:0,tw:0,tl:0,tt:0,gp:0});
  const P=(tk,i)=>player[`${tk}#${i}`]??=({tk,i,w:0,d:0,l:0,pf:0,pa:0,gp:0});
  S.divisions.forEach(d=>{["h","a"].forEach(s=>{club[s].byDiv[d.id]=0;for(let n=1;n<=3;n++){T(`${d.id}-${s}${n}`);for(let i=0;i<3;i++)P(`${d.id}-${s}${n}`,i)}})});
  for(const m of matches()){
    let hw=0,aw=0,any=false;
    for(let g=1;g<=3;g++){
      const s=sc(m.key,g); if(!s) continue; any=true;
      const [hs,as]=s, res=hs>as?1:hs<as?-1:0;
      if(res>0)hw++; else if(res<0)aw++;
      const apply=(o,pf,pa,r)=>{o.pf+=pf;o.pa+=pa;o.gp=(o.gp||0)+1;if(r>0)o.w++;else if(r<0)o.l++;else o.d++};
      apply(T(m.h),hs,as,res); apply(T(m.a),as,hs,-res);
      PAIRS[g-1].forEach(i=>{apply(P(m.h,i),hs,as,res);apply(P(m.a,i),as,hs,-res)});
      apply(club.h,hs,as,res); apply(club.a,as,hs,-res);
      if(res>0)club.h.byDiv[m.div.id]++; else if(res<0)club.a.byDiv[m.div.id]++;
    }
    if(any){
      const done=[1,2,3].every(g=>sc(m.key,g));
      if(done){ if(hw>aw){T(m.h).tw++;T(m.a).tl++}else if(aw>hw){T(m.a).tw++;T(m.h).tl++}else{T(m.h).tt++;T(m.a).tt++} }
    }
  }
  return {team,player,club};
}
const rank=arr=>arr.sort((x,y)=>(y.w+y.d/2)-(x.w+x.d/2)||(y.pf-y.pa)-(x.pf-x.pa)||y.pf-x.pf);
const sideOf=tk=>tk.split("-")[1][0];
const sgn=n=>n>0?`+${n}`:`${n}`;

/* ----- UI state ----- */
let tab=ss.get("tab")||"draw";
let divFilter=ls.get("divFilter")||"all";
let canEdit=false, committee=ls.get("committee")!=="off", readOnlyReason="", userEmail=null, showLogin=false, loginMsg="", loginEmail="";
let dirty=new Map();  // unsaved edits: id -> field path in the event document
let toastMsg=ss.get("flash")||""; ss.del("flash");
const isTV=()=>location.hash==="#tv";
const scorerDiv=()=>{const m=/^#score-(\w+)$/.exec(location.hash);return m?m[1]:null};
let testMode=false;  // the GitHub version uses committee logins instead of test mode
const canControl=()=>canEdit||testMode;
const editing=()=>canControl()&&committee&&!isTV();

/* ----- render: shared header ----- */
function header(st){
  const c=S.clubs;
  const tabs=[["draw","Draw"],["standings","Standings"],["teams","Teams"]];
  if(editing()) tabs.push(["setup","Committee setup"]);
  return `<header class="top"><div class="wrap">
    <div class="headrow">
      <div><div class="eyebrow">${esc(E().name)}${E().date?` · ${esc(new Date(E().date+"T00:00").toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"}))}`:""}${E().venue?` · ${esc(E().venue)}`:""}</div>
      <h1><span class="atp">${esc(c.h.name)}</span><span class="vs">vs</span><span class="dural">${esc(c.a.name)}</span></h1></div>
      <div class="board" aria-label="Games won by club">
        <span class="logo h" role="img" aria-label="${esc(c.h.name)} logo"></span>
        <div class="club atp"><b class="num">${st.club.h.w}</b><span>${esc(c.h.short)}</span></div>
        <div class="dash">–</div>
        <div class="club dural"><b class="num">${st.club.a.w}</b><span>${esc(c.a.short)}</span></div>
        <span class="logo a" role="img" aria-label="${esc(c.a.name)} logo"></span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      ${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}
      ${canControl()?`<button class="tvbtn" data-act="tv">TV display ▸</button>`:""}
    </nav>
  </div></header>`;
}

/* ----- draw tab ----- */
function scoreCell(m,g){
  const s=sc(m.key,g);
  if(editing()){
    const v=S.scores[gkey(m.key,g)]||["",""];
    const ch=dirty.has(gkey(m.key,g))?" changed":"";
    return `<div class="score"><input id="s-${gkey(m.key,g)}-0" class="${ch.trim()}" data-g="${gkey(m.key,g)}" data-i="0" inputmode="numeric" type="number" min="0" max="99" value="${esc(v[0])}" aria-label="${esc(S.teams[m.h].name)} score"> <span class="muted">–</span> <input id="s-${gkey(m.key,g)}-1" class="${ch.trim()}" data-g="${gkey(m.key,g)}" data-i="1" inputmode="numeric" type="number" min="0" max="99" value="${esc(v[1])}" aria-label="${esc(S.teams[m.a].name)} score"></div>`;
  }
  if(!s) return `<div class="score"><span class="blank">vs</span></div>`;
  const [a,b]=s;
  return `<div class="score num"><span class="${a>b?"w win-h":a===b?"w":"l"}">${a}</span><span class="muted">–</span><span class="${b>a?"w win-a":a===b?"w":"l"}">${b}</span></div>`;
}
function matchCard(m,p){
  let hw=0,aw=0,n=0;
  for(let g=1;g<=3;g++){const s=sc(m.key,g);if(s){n++;if(s[0]>s[1])hw++;else if(s[1]>s[0])aw++}}
  const live=(p.kind==="game"||p.kind==="gap")&&p.round===m.r;
  const courtSel=editing()?`<select id="c-${m.key}" data-court="${m.key}" aria-label="Court">${Array.from({length:Math.max(12,m.court)},(_,i)=>`<option value="${i+1}"${i+1==m.court?" selected":""}>Ct ${i+1}</option>`).join("")}</select>`:`Ct ${m.court}`;
  return `<article class="match${live?" isLive":""}">
    <div class="mhead"><span class="court">${courtSel}</span>
      <div class="teams"><span class="atp">${esc(S.teams[m.h].name)}</span><span class="v">v</span><span class="dural">${esc(S.teams[m.a].name)}</span></div>
      ${n?`<span class="tie num" title="Games won"><span class="atp">${hw}</span><span class="muted">–</span><span class="dural">${aw}</span></span>`:""}
    </div>
    ${editing()?`<div class="game ghead" aria-hidden="true"><div class="score"><span class="atp">${esc(S.clubs.h.short)}</span><span class="dash">–</span><span class="dural">${esc(S.clubs.a.short)}</span></div></div>`:""}
    ${[1,2,3].map(g=>{
      const cur=p.kind==="game"&&p.round===m.r&&p.game===g;
      return `<div class="game${cur?" cur":""}">
        <div class="t"><b>Game ${g}</b></div>
        <div class="pair home">${pairHTML(m.h,g)}</div>
        ${scoreCell(m,g)}
        <div class="pair away">${pairHTML(m.a,g)}</div>
      </div>`}).join("")}
  </article>`;
}
function programHTML(){
  const st=roundStarts();
  const items=[[fmtT(timeOn(E().arrive)),"Arrival & warm-up"],[fmtT(timeOn(E().briefing)),"Briefing & welcome"],
    ...st.map((t,i)=>[fmtT(t),`Round ${i+1}`]),[fmtT(dbStart()),"Dreambreakers"],["After","BBQ lunch"]];
  return `<div class="program" aria-label="Today's timetable"><span class="ptitle">Today</span>${items.map(([t,l])=>`<span><b class="num">${esc(t)}</b>${esc(l)}</span>`).join("")}</div>`;
}
function dbCard(d,p){
  const k=`db-${d.id}`, ct=S.courts[k], live=p.kind==="db";
  const courtSel=editing()?`<select id="c-${k}" data-court="${k}" aria-label="Court">${Array.from({length:Math.max(12,ct)},(_,i)=>`<option value="${i+1}"${i+1==ct?" selected":""}>Ct ${i+1}</option>`).join("")}</select>`:`Ct ${ct}`;
  const list=side=>`<ol>${dbOrder(d,side).map(([tk,i])=>`<li>${pnp(tk,i)}</li>`).join("")}</ol>`;
  return `<article class="match${live?" isLive":""}">
    <div class="mhead"><span class="court">${courtSel}</span><div class="teams">${esc(d.name)} · ${esc(d.dupr)}</div></div>
    <div class="game"><div class="t"><b>Game</b>To 25</div><div class="pair home"><span class="pn">${esc(S.clubs.h.short)}</span></div>${(()=>{const i=dbInfo(d);return `<div class="score num"><span class="${i.h>=i.a?"w":"l"}">${i.h}</span><span class="muted">–</span><span class="${i.a>=i.h?"w":"l"}">${i.a}</span></div>`})()}<div class="pair away"><span class="pn">${esc(S.clubs.a.short)}</span></div></div>
    ${canControl()?`<div class="dbopen"><button class="btn primary" data-act="openScore" data-d="${d.id}">Open live scorer for Court ${ct}</button><span class="muted">Hand this to the scorer at the court</span></div>`:""}
    <div class="dbrot"><div><div class="eyebrow atp">${esc(S.clubs.h.short)} rotation</div>${list("h")}</div><div><div class="eyebrow dural">${esc(S.clubs.a.short)} rotation</div>${list("a")}</div></div>
    ${editing()?(()=>{const started=(()=>{const i=dbInfo(d);return i.h+i.a>0})(), custom=!!(S.dbOrder&&S.dbOrder[`${d.id}-h`]);
      return `<div class="dbopen"><button class="btn" data-act="dbShuffle" data-d="${d.id}"${started?" disabled":""}>🔀 Randomise rotation</button>${custom?`<button class="btn" data-act="dbUnshuffle" data-d="${d.id}"${started?" disabled":""}>Back to team order</button>`:""}<span class="muted">${started?"Locked once the game has started":custom?"Random order · reprint the sheets if already printed":"Team order (Team 1, then 2, then 3)"}</span></div>`})():""}
  </article>`;
}
function drawTab(){
  const p=phase(), ms=matches(), st=roundStarts();
  const divs=S.divisions.filter(d=>divFilter==="all"||divFilter===d.id);
  let html=(editing()?timerControls():"")+programHTML()+`<div class="chips" role="group" aria-label="Division">
    <button class="chip" data-div="all" aria-pressed="${divFilter==="all"}">Both divisions</button>
    ${S.divisions.map(d=>`<button class="chip" data-div="${d.id}" aria-pressed="${divFilter===d.id}">${esc(d.name)} · ${esc(d.dupr)}</button>`).join("")}
  </div>`;
  for(let r=1;r<=ROUNDS;r++){
    const status=roundStatus(r);
    const pill=status==="live"?`<span class="pill live">On court now</span>`:status==="done"?`<span class="pill done">Finished</span>`:status==="next"?`<span class="pill next">Up next</span>`:"";
    const end=st[r-1]+roundLen()*60000;
    html+=`<section class="round" id="round-${r}">
      <div class="roundhead"><h2>Round ${r}</h2>${pill}
      ${editing()?`<button class="btn" data-start="${r}" style="margin-left:auto">Start round ${r} now</button>`:""}</div>
      ${divs.map(d=>`<div class="divlabel">${esc(d.name)} · ${esc(d.dupr)}</div>
        <div class="matches">${ms.filter(m=>m.r===r&&m.div.id===d.id).sort((a,b)=>a.court-b.court).map(m=>matchCard(m,p)).join("")}</div>`).join("")}
    </section>`;
  }
  const dstat=p.kind==="db"?"live":p.kind==="done"?"done":p.round===DB?"next":"later";
  const dpill=dstat==="live"?`<span class="pill live">On court now</span>`:dstat==="done"?`<span class="pill done">Finished</span>`:dstat==="next"?`<span class="pill next">Up next</span>`:"";
  html+=`<section class="round" id="dreambreaker">

function csvRows(text){
  text=text.replace(/^\uFEFF/,"");
  const first=text.split(/\r?\n/).find(l=>l.trim())||"";
  const sep=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=ch; continue }
    if(ch==='"'&&cell==="") q=true;
    else if(ch===sep){row.push(cell);cell=""}
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n")i++; row.push(cell);rows.push(row);row=[];cell="" }
    else cell+=ch;
  }
  row.push(cell);rows.push(row);
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}

function importRows(rows){

    return S.divisions.find((d,i)=>v===String(i+1)||v===d.id||v===low(d.name)||v===low(d.dupr)||v.replace(/\D/g,"")===String(i+1)&&!/\./.test(v))||null};
  const findClub=c=>{const v=low(c);if(!v)return null;
    for(const s of ["h","a"]){const cl=S.clubs[s];if(v===s||v===low(cl.short)||v===low(cl.name)||low(cl.name).startsWith(v)||v.startsWith(low(cl.short)))return s}

  rows.forEach((r,n)=>{

    if(!findClub(r[1])&&!(parseInt(r[2],10)>=1))return;   // heading, title or section row
    const d=findDiv(r[0]), s=findClub(r[1]), t=parseInt(r[2],10);

    if(!s){errs.push(`Row ${line}: club "${r[1]||""}" not recognised (use ${S.clubs.h.short} or ${S.clubs.a.short}).`);return}
    if(!(t>=1&&t<=3)){errs.push(`Row ${line}: team "${r[2]||""}" should be 1, 2 or 3.`);return}
    todo.push({k:`${d.id}-${s}${t}`,name:r[3]||"",players:[r[4]||"",r[5]||"",r[6]||""],line});
  });

  let changed=0;
  todo.forEach(x=>{const tm=S.teams[x.k], before=JSON.stringify(tm); if(x.name)tm.name=x.name; x.players.forEach((p,i)=>{if(p)tm.players[i]=p});
    if(JSON.stringify(tm)!==before){markTeam(x.k);changed++}});
  csvMsg=changed?`Imported ${todo.length} team${todo.length>1?"s":""}, ${changed} with new names. Check them below, then press "Save and update all screens".`:`Imported ${todo.length} team${todo.length>1?"s":""}. The names already match, so nothing changed.`;
  render();
}
function csvTemplate(){

    ["xl/styles.xml",styles],["xl/worksheets/sheet1.xml",sheet]]);

async function xlsxRows(buf){
  const z=await zipRead(buf), P=new DOMParser(), NS="http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const txt=el=>[...el.getElementsByTagNameNS(NS,"t")].map(t=>t.textContent).join("");
  const shared=z["xl/sharedStrings.xml"]?[...P.parseFromString(z["xl/sharedStrings.xml"],"application/xml").getElementsByTagNameNS(NS,"si")].map(txt):[];
  let path="xl/worksheets/sheet1.xml";
  try{const wb=P.parseFromString(z["xl/workbook.xml"],"application/xml"), first=wb.getElementsByTagNameNS(NS,"sheet")[0];
    const rid=first.getAttribute("r:id")||first.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const rel=[...P.parseFromString(z["xl/_rels/workbook.xml.rels"],"application/xml").getElementsByTagName("Relationship")].find(r=>r.getAttribute("Id")===rid);
    const t=rel.getAttribute("Target"); path=t.startsWith("/")?t.slice(1):"xl/"+t.replace(/^\.\//,"");}catch(e){}
  if(!z[path]) path=Object.keys(z).find(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k));
  if(!z[path]) throw new Error("no sheet");
  const doc=P.parseFromString(z[path],"application/xml"), rows=[];
  for(const row of doc.getElementsByTagNameNS(NS,"row")){
    const r=Array(7).fill("");
    for(const c of row.getElementsByTagNameNS(NS,"c")){
      const ci=(c.getAttribute("r")||"").replace(/\d/g,"").split("").reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0)-1;
      if(ci<0||ci>6)continue;
      const t=c.getAttribute("t"), v=c.getElementsByTagNameNS(NS,"v")[0]?.textContent??"";
      r[ci]=String(t==="s"?shared[+v]??"":t==="inlineStr"?txt(c):v).trim();
    }
    r.line=+row.getAttribute("r")||rows.length+1;
    if(r.some(x=>x))rows.push(r);
  }
  return rows;
}

/* ----- timer text ----- */
function phaseInfo(st){
  const p=phase(), c=S.clubs, now=nowT();
  let lbl="",sub="",cd="",cls=p.kind;
  if(p.kind==="pre"){const br=timeOn(E().briefing);
    if(now<br){sub=`Warm-up · briefing & welcome at ${fmtT(br)}`;lbl=`Round 1 starts ${fmtT(p.until)}`}
    else if(now<p.until){sub="Briefing & welcome";lbl=`Round 1 starts ${fmtT(p.until)}`}
    else {sub="Briefing & welcome";lbl="Round 1 starting soon"}
    cd=""}
  else if(p.kind==="game"){sub=`Round ${p.round} · game ${p.game} of 3`;lbl="Time remaining";cd=mmss(p.until-now);if(p.until-now<60000)cls+=" low"}
  else if(p.kind==="gap"){sub=`Round ${p.round} · changeover`;lbl=`Game ${p.game} starts in`;cd=mmss(p.until-now)}
  else if(p.kind==="brk"&&p.round===DB){sub="Break before the dreambreaker";lbl="Dreambreaker starts in";cd=mmss(p.until-now)}
  else if(p.kind==="brk"){sub="Break between rounds";lbl=`Round ${p.round} starts in`;cd=mmss(p.until-now)}
  else if(p.kind==="db"){sub="Dreambreaker · rally scoring, first to 25";lbl="Dreambreaker in play";cd=""}
  else {st=st||stats();sub="All games complete";lbl=st.club.h.w>st.club.a.w?`${c.h.short} win the challenge`:st.club.a.w>st.club.h.w?`${c.a.short} win the challenge`:"Challenge drawn";cd=""}
  if(S.pausedAt!=null){cls+=" paused";sub="Timer paused · "+sub}
  return {p,lbl,sub,cd,cls};
}
/* pause / resume / restart: all saved so every screen follows */
function currentRoundIdx(t){const st=roundStarts(),rl=roundLen()*60000;for(let r=0;r<ROUNDS;r++){if(t<st[r]+rl)return r+1}return null}
const CTRL=[["roundStart"],["pausedAt"],["dbOrder"],["dbIdx"]];
function timerPause(){if(S.pausedAt!=null)return;S.pausedAt=Date.now();save(CTRL)}
function timerResume(){
  if(S.pausedAt==null)return;
  const shift=Date.now()-S.pausedAt, k=currentRoundIdx(S.pausedAt);
  if(k){const st=roundStarts();S.roundStart={...(S.roundStart||{})};S.roundStart[k]=st[k-1]+shift;for(let x=k+1;x<=DB;x++)delete S.roundStart[x]}
  else if(S.pausedAt<dbStart()){S.roundStart={...(S.roundStart||{})};S.roundStart[DB]=dbStart()+shift}
  delete S.pausedAt; save(CTRL);
}
function timerRestartGame(){
  const p=phase(); if(p.kind==="done"||p.kind==="db")return;
  const now=Math.floor(Date.now()/1000)*1000, g=p.game, r=p.round;
  S.roundStart={...(S.roundStart||{})};
  S.roundStart[r]=now-(g-1)*(E().gameMin+E().gapMin)*60000;
  for(let x=r+1;x<=DB;x++)delete S.roundStart[x];
  delete S.pausedAt; save(CTRL);
}
function skipLabel(p){
  if(p.kind==="game") return p.game<3?`Skip to changeover`:(p.round<ROUNDS?`End round ${p.round}`:`End final game`);
  if(p.kind==="gap") return `Skip to game ${p.game}`;
  if(p.kind==="brk"&&p.round===DB) return "Start dreambreaker now";
  if(p.kind==="pre"||p.kind==="brk") return `Start round ${p.round} now`;
  return "";
}
function timerSkip(){
  const p=phase(); if(p.kind==="done"||p.kind==="db")return;
  const now=Math.floor(Date.now()/1000)*1000, st=roundStarts(), r=p.round;
  S.roundStart={...(S.roundStart||{})};
  if(p.kind==="pre"||p.kind==="brk") S.roundStart[r]=now;
  else S.roundStart[r]=st[r-1]-(p.until-nowT());
  for(let x=r+1;x<=DB;x++)delete S.roundStart[x];
  delete S.pausedAt; save(CTRL);
}

/* grow the court text to fill the cards on big screens, shrink it if long names don't fit */
function fitTV(){
  const box=document.querySelector(".tvcourts:not(.db)"); if(!box) return;
  const cards=[...box.querySelectorAll(".tvm")]; if(!cards.length) return;
  const tns=[...box.querySelectorAll(".tvm .tn")];
  const sides=[...box.querySelectorAll(".tvm .side")];
  const over=()=>cards.some(c=>c.scrollHeight>c.clientHeight+1||c.scrollWidth>c.clientWidth+1)||sides.some(x=>x.scrollWidth>x.clientWidth+1);
  const step=(name,from,bad)=>{let k=from;box.style.setProperty(name,k);while(k>0.6&&bad()){k=Math.round((k-0.05)*100)/100;box.style.setProperty(name,k)}};
  const cut=()=>tns.some(t=>t.scrollWidth>t.clientWidth+1);
  const pns=[...box.querySelectorAll(".tvm .pn")];
  const wraps=()=>pns.some(x=>x.offsetHeight>parseFloat(getComputedStyle(x).fontSize)*1.6);
  // player names as big as fit in the card, ideally each on one line; team names as big as fit on one line at that size
  const fit=(minK,oneLine)=>{for(let k=1.6;k>=minK;k=Math.round((k-0.05)*100)/100){
    box.style.setProperty("--k",k); step("--kt",1.4,cut);
    if(!over()&&!(oneLine&&wraps())) return true;
  } return false};
  if(!fit(0.85,true)) fit(0.6,false);
}

function buildPDF(JsPDF,kind){
  const doc=new JsPDF({unit:"mm",format:"a4"});
  if(kind==="schedule"||kind==="all") pdfSchedule(doc);
  if(kind==="cards"||kind==="all") pdfScoreCards(doc,kind==="cards");
  if(kind==="courts"||kind==="all") pdfCourtSheets(doc,kind==="courts");
  if(kind==="results") pdfResults(doc);
  return doc;
}
async function makeSheets(kind){
  let JsPDF; try{JsPDF=await loadJsPDF()}catch(e){toast("Couldn't load the PDF maker. Check the internet connection and try again.");return}
  const doc=buildPDF(JsPDF,kind);
  const names={all:"All sheets",schedule:"Schedule",cards:"Score cards",courts:"Court sheets",results:"Final results"};
  const a=document.createElement("a");a.href=URL.createObjectURL(doc.output("blob"));a.download=`ATP v Dural Interclub - ${names[kind]}.pdf`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),15000);
  toast("PDF downloaded. Open it and print on A4.");
}

  return `<main class="scorer"><div class="wrap">
    <div class="sc-top"><button class="btn" data-act="exitScore">← Draw</button><div><b>Court ${S.courts["db-"+d.id]}</b> · Dreambreaker · ${esc(d.dupr)}</div><span class="sc-save">Live</span></div>
    <div class="sc-score num"><span class="atp">${i.h}</span><span class="dash">–</span><span class="dural">${i.a}</span></div>
    <div class="sc-status ${i.over?"over":""}${al.swapping?" swapping":""}${al.warn?" warn":""}">${status}</div>
    <div class="sc-pairs${al.swapping?" swapping":""}">
      <div><span class="eyebrow atp">${esc(c.h.short)} on court</span><b>${pnp(...h1)} &amp; ${pnp(...h2)}</b>${i.frozen?"":`<small class="${al.warn?"warnnext":""}">${al.warn?"Get ready":"Next"}: ${pnp(...nh1)} &amp; ${pnp(...nh2)}</small>`}</div>
      <div><span class="eyebrow dural">${esc(c.a.short)} on court</span><b>${pnp(...a1)} &amp; ${pnp(...a2)}</b>${i.frozen?"":`<small class="${al.warn?"warnnext":""}">${al.warn?"Get ready":"Next"}: ${pnp(...na1)} &amp; ${pnp(...na2)}</small>`}</div>
    </div>
    <div class="sc-btns">
      <button class="sc-plus h" data-pt="${d.id}" data-side="h" data-v="1"${i.over?" disabled":""}>+1 ${esc(c.h.short)}</button>
      <button class="sc-plus a" data-pt="${d.id}" data-side="a" data-v="1"${i.over?" disabled":""}>+1 ${esc(c.a.short)}</button>
      <button class="btn" data-pt="${d.id}" data-side="h" data-v="-1">−1 ${esc(c.h.short)}</button>
      <button class="btn" data-pt="${d.id}" data-side="a" data-v="-1">−1 ${esc(c.a.short)}</button>
    </div>
    <p class="sub">Rally scoring: every rally wins a point. Pairs swap every ${DB_EVERY} points scored (both teams together) until a team reaches ${DB_FREEZE}. First to ${DB_TO} wins.</p>
  </div></main>`;
}
function loginBox(){
  if(userEmail) return `<footer class="loginbar"><span>Signed in as <b>${esc(userEmail)}</b>${canEdit?" · committee":""}</span><button class="btn" data-act="logout">Sign out</button></footer>`;
  if(!showLogin) return `<footer class="loginbar"><button class="btn ghostlink" data-act="showLogin">Committee login</button></footer>`;
  return `<footer class="loginbar"><form id="loginForm" class="loginform">
    <label class="field">Email<input id="lg-email" type="email" autocomplete="username" required value="${esc(loginEmail)}"></label>
    <label class="field">Password<input id="lg-pass" type="password" autocomplete="current-password" required></label>
    <div class="actions"><button class="btn primary" type="submit">Log in</button><button class="btn" type="button" data-act="forgot">Forgot password</button><button class="btn" type="button" data-act="hideLogin">Cancel</button></div>
    ${loginMsg?`<p class="sub" style="margin:0">${esc(loginMsg)}</p>`:""}</form></footer>`;
}
let installEvt=null, installHelp=false;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;render()});
window.addEventListener("appinstalled",()=>{installEvt=null;toast("Installed. Open Interclub from your home screen or apps.")});
function installBar(){
  if(standalone()||isTV()||(!installEvt&&!isIOS)) return "";
  if(installHelp&&isIOS) return `<div class="installbar"><img src="icon-192.png" alt=""><span>On iPhone or iPad: tap the <b>Share</b> button <b>⬆︎</b> in Safari, then <b>Add to Home Screen</b>.</span><button class="btn" data-act="installClose">OK</button></div>`;
  return `<div class="installbar"><img src="icon-192.png" alt=""><span>Get the draw and live scores as an app on this device.</span><button class="btn primary" data-act="install">Install app</button></div>`;
}
function render(){
  const app=$("#app");
  if(configError){app.innerHTML=`<main><div class="wrap"><div class="card"><h3>Almost there</h3><p>${esc(configError)}</p></div></div></main>`;return}
  if(!loaded){
    app.innerHTML=`<main><div class="wrap"><div class="card"><h3>${missing?"Event not set up yet":"Loading the draw…"}</h3>
      ${missing?(canEdit?`<p class="sub">The database is ready but has no event yet. Create it with the example teams, then enter the real names on the Teams tab.</p><button class="btn primary" data-act="createEvent">Create the event</button>`:(readOnlyReason?`<p class="banner warn" style="margin:8px 0 0">${esc(readOnlyReason)}</p>`:`<p class="sub">Committee members: log in below to set it up.</p>`)):""}
    </div></div>${missing?loginBox():""}</main>${toastMsg?`<div class="toast" role="status">${esc(toastMsg)}</div>`:""}`;return}
  if(scorerDiv()){app.innerHTML=scorerView(scorerDiv())+(toastMsg?`<div class="toast" role="status">${esc(toastMsg)}</div>`:"");return}
  if(isTV()){app.innerHTML=tvView();fitTV();return}
  const st=stats();
  if(tab==="setup"&&!editing()) tab="draw";
  let banners="";
  if(!S.demo&&S.scoresUndo&&editing()&&Date.now()-S.scoresUndo.at<10*60000) banners+=undoBox();
  if(S.demo) banners+=`<div class="banner warn"><span>Example names and Round 1 example scores are loaded so you can see how it works.</span>${editing()?`<button class="btn" data-act="clearDemo">Clear example scores</button>`:""}</div>`;
  if(canEdit) banners+=`<div class="banner info"><span>${committee?"Committee mode: you can enter scores, courts and names. Everyone else sees a read-only page.":"Viewing as a player. Turn committee mode on to edit."}</span><button class="btn" data-act="toggleCommittee">${committee?"View as player":"Committee mode"}</button></div>`;
  else if(readOnlyReason) banners+=`<div class="banner info"><span>${esc(readOnlyReason)}</span></div>`;
  const body=tab==="standings"?standingsTab():tab==="teams"?teamsTab():tab==="setup"?setupTab():drawTab();
  app.innerHTML=`${header(st)}<main><div class="wrap">${banners}${body}${installBar()}${loginBox()}</div></main>${saveBar()}${toastMsg?`<div class="toast" role="status">${esc(toastMsg)}</div>`:""}`;
}
function saveBar(){
  if(!editing()||!dirty.size) return "";
  return `<div class="savebar" id="savebar"><span><b>${dirty.size}</b> unsaved change${dirty.size>1?"s":""}</span><button class="btn" data-act="save" id="saveBtn">Save and update all screens</button><button class="btn ghost" data-act="discard">Discard</button></div>`;
}
function refreshSaveBar(){
  const old=$("#savebar"); const html=saveBar();
  if(old) old.remove();
  if(html) document.querySelector("main")?.insertAdjacentHTML("afterend",html);
}
let toastTimer;
function toast(m){toastMsg=m;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastMsg="";const t=$(".toast");t&&t.remove()},5000)}

/* ----- dreambreaker live scoring: each press is queued and survives page reloads ----- */
const SID=(()=>{let v=ss.get("sid");if(!v){v=Math.random().toString(36).slice(2,10);ss.set("sid",v)}return v})();
function dbQueue(){try{return JSON.parse(ss.get("dbq")||"[]")}catch(e){return[]}}
function dbApplyQueue(){
  const seen=(S.dbSeen&&S.dbSeen[SID])||0, q=dbQueue().filter(x=>x.n>seen);
  ss.set("dbq",JSON.stringify(q));
  q.forEach(x=>dbPoint(x.d,x.s,x.v));
  if(q.length){S.dbSeen={...(S.dbSeen||{}),[SID]:q[q.length-1].n}}
  return q.length;
}
let dbTimer=null, dbSaving=false;
function dbPress(divId,side,delta){
  if(!canEdit){toast("Log in as a committee member to score.");return}
  const dv=S.divisions.find(x=>x.id===divId), before=dv?dbIdx(dv):0;
  dbPoint(divId,side,delta);
  if(dv&&delta>0){const i=dbInfo(dv);try{ if(i.idx!==before) navigator.vibrate?.([300,120,300,120,300]); else if(!i.frozen&&i.toSwap===1) navigator.vibrate?.(150);}catch(e){}}
  render();
  const k=`db-${divId}`;
  updateDoc(evRef,new FieldPath("scores",`${k}-g1`),clone(S.scores[`${k}-g1`]),new FieldPath("dbIdx",k),S.dbIdx[k])
    .catch(e=>toast(e&&e.code==="permission-denied"?"Your login isn't on the committee list.":"Point not saved. Check the internet connection."));
}

/* ----- database (Firebase) ----- */
const getPath=(o,p)=>p.reduce((a,k)=>a==null?undefined:a[k],o);
function setPath(o,p,v){let x=o;for(let i=0;i<p.length-1;i++){x[p[i]]??={};x=x[p[i]]}if(v===undefined)delete x[p[p.length-1]];else x[p[p.length-1]]=v}
let db=null, auth=null, evRef=null;
async function save(extra=[]){
  if(!canEdit){toast("Log in as a committee member to make changes.");return}
  const seen=new Set(), args=[];
  for(const p of [...dirty.values(),...extra]){const key=p.join("\u0001");if(seen.has(key))continue;seen.add(key);
    const v=getPath(S,p); args.push(new FieldPath(...p), v===undefined?deleteField():clone(v));}
  if(!args.length)return;
  const b=$("#saveBtn"); if(b){b.disabled=true;b.textContent="Saving…"}
  try{ await updateDoc(evRef,...args); dirty.clear(); toast("Saved. Every screen, including the TV, is updated."); }
  catch(e){
    if(b){b.disabled=false;b.textContent="Save and update all screens"}
    toast(e&&e.code==="permission-denied"?"Your login isn't on the committee list, so changes can't be saved.":"Couldn't save. Check the internet connection and try again.");
  }
}
let pendingRender=false;
function typing(){const a=document.activeElement;return a&&a.closest&&a.closest("#app")&&/^(INPUT|SELECT)$/.test(a.tagName)}
function scheduleRender(){ if(typing()&&!isTV()&&!scorerDiv()){pendingRender=true;refreshSaveBar();return} pendingRender=false; render(); }
document.addEventListener("focusout",e=>{ if(!pendingRender)return; setTimeout(()=>{ if(!typing()){pendingRender=false;render()} },0) });
function applyServer(data){
  const local=dirty.size?clone(S):null;
  SERVER=clone(data); S=clone(data); ensure();
  if(local) for(const p of dirty.values()) setPath(S,p,getPath(local,p));
  loaded=true; missing=false; scheduleRender();
}
async function checkCommittee(u){
  userEmail=u?.email||null; canEdit=false; readOnlyReason="";
  if(u){ try{ const c=await getDoc(doc(db,"config","committee"));
      const list=(c.data()?.emails||[]).map(x=>String(x).trim().toLowerCase());
      canEdit=list.includes(u.email.toLowerCase());
      if(!canEdit) readOnlyReason=`${u.email} isn't on the committee list. Ask the organiser to add it in Firebase (config → committee → emails).`;
    }catch(e){ readOnlyReason="Couldn't check the committee list. Check the Firebase rules are published."; } }
  render();
}
function startFirebase(){
  if(!firebaseConfig||!firebaseConfig.apiKey||/PASTE/.test(firebaseConfig.apiKey)){configError="Firebase isn't connected yet. Paste your Firebase settings into firebase-config.js (see the setup guide).";render();return}
  try{
    const app=initializeApp(firebaseConfig); db=getFirestore(app); auth=getAuth(app);
    evRef=doc(db,"events",EVENT_ID||"interclub");
    onSnapshot(evRef,snap=>{ if(snap.exists()) applyServer(snap.data()); else {missing=true;loaded=false;render()} },
      err=>{configError="Couldn't read the event from Firebase: "+(err.code||err.message)+". Check the Firestore rules are published.";render()});
    onAuthStateChanged(auth,u=>checkCommittee(u));
  }catch(e){configError="Firebase settings look wrong: "+e.message;render()}
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="loginForm")return; e.preventDefault();
  const em=$("#lg-email").value.trim(), pw=$("#lg-pass").value; loginEmail=em; loginMsg="Logging in…";
  try{ await signInWithEmailAndPassword(auth,em,pw); showLogin=false; loginMsg=""; }
  catch(err){ loginMsg=/invalid|wrong|not-found|credential/.test(err.code||"")?"That email and password don't match. Try again or use Forgot password.":"Couldn't log in: "+(err.code||err.message); render(); }
});

/* ----- events ----- */
document.addEventListener("click",e=>{
  const pt=e.target.closest("[data-pt]"); if(pt){dbPress(pt.dataset.pt,pt.dataset.side,+pt.dataset.v);return}
  const t=e.target.closest("[data-tab],[data-div],[data-act],[data-start]"); if(!t) return;
  if(t.dataset.tab){tab=t.dataset.tab;ss.set("tab",tab);render();window.scrollTo(0,0);return}
  if(t.dataset.div){divFilter=t.dataset.div;ls.set("divFilter",divFilter);render();return}
  if(t.dataset.start){const r=+t.dataset.start;S.roundStart={...(S.roundStart||{})};
    const nowMin=Math.floor(Date.now()/60000)*60000;S.roundStart[r]=nowMin;for(let x=r+1;x<=DB;x++)delete S.roundStart[x];delete S.pausedAt;save(CTRL);return}
  const a=t.dataset.act;
  if(a==="tv"){location.hash="tv";return}
  if(a==="dbStart"){
    if(t.dataset.armed){S.roundStart={...(S.roundStart||{}),[DB]:Math.floor(Date.now()/1000)*1000};delete S.pausedAt;save(CTRL);return}
    t.dataset.armed="1";t.textContent="Tap again to start the dreambreakers";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;render()}},4000);return}
  if(a==="dbShuffle"){
    if(t.dataset.armed){dbShuffle(t.dataset.d);save(CTRL);return}
    t.dataset.armed="1";t.textContent="Tap again to randomise";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;render()}},4000);return}
  if(a==="dbUnshuffle"){const o={...(S.dbOrder||{})};delete o[t.dataset.d+"-h"];delete o[t.dataset.d+"-a"];S.dbOrder=o;delete (S.dbIdx||{})["db-"+t.dataset.d];save(CTRL);return}
  if(a==="openScore"){location.hash="score-"+t.dataset.d;window.scrollTo(0,0);return}
  if(a==="exitScore"){history.replaceState(null,"",location.pathname+location.search);tab="draw";onHash();return}
  if(a==="exitTv"){history.replaceState(null,"",location.pathname+location.search);onHash();return}
  if(a==="fs"){const el=document.documentElement;(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?.())?.catch?.(()=>{});return}
  if(a==="save"){save();return}
  if(a==="pdf"){const k=t.dataset.kind,txt=t.textContent;t.disabled=true;t.textContent="Building PDF…";makeSheets(k).finally(()=>{t.disabled=false;t.textContent=txt});return}
  if(a==="tPause"){timerPause();return}
  if(a==="tResume"){timerResume();return}
  if(a==="tSkip"){
    if(t.dataset.armed){timerSkip();return}
    t.dataset.armed="1";t.textContent=phase().kind==="pre"?"Tap again to start Round 1":"Tap again to skip";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;render()}},4000);return}
  if(a==="tRestart"){
    if(t.dataset.armed){timerRestartGame();return}
    t.dataset.armed="1";t.textContent="Tap again to restart";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;render()}},4000);return}
  if(a==="discard"){S=clone(SERVER||DEFAULTS);ensure();dirty.clear();render();return}
  if(a==="install"){ if(installEvt){const ev=installEvt;ev.prompt();ev.userChoice.finally(()=>{installEvt=null;render()})} else {installHelp=true;render()} return}
  if(a==="installClose"){installHelp=false;render();return}
  if(a==="showLogin"){showLogin=true;loginMsg="";render();setTimeout(()=>$("#lg-email")?.focus(),0);return}
  if(a==="hideLogin"){showLogin=false;render();return}
  if(a==="logout"){signOut(auth);return}
  if(a==="forgot"){const em=$("#lg-email")?.value.trim();if(!em){loginMsg="Type your email first, then press Forgot password.";render();return}
    sendPasswordResetEmail(auth,em).then(()=>{loginMsg="Password reset email sent.";render()}).catch(()=>{loginMsg="Couldn't send the reset email. Check the address.";render()});return}
  if(a==="createEvent"){S=clone(DEFAULTS);ensure();setDoc(evRef,clone(S)).then(()=>toast("Event created.")).catch(e=>toast(e.code==="permission-denied"?"Your login isn't on the committee list.":"Couldn't create the event."));return}
  if(a==="csvTemplate"){saveTemplate();return}
  if(a==="csvPasteGo"){const v=$("#csvPaste")?.value||"";csvImport(v);return}
  if(a==="toggleCommittee"){committee=!committee;ls.set("committee",committee?"on":"off");render();return}
  if(a==="clearDemo"){clearAllScores();return}
  if(a==="undoClear"){undoClear();return}
  if(a==="resetTimes"){S.roundStart={};delete S.pausedAt;save(CTRL);return}
  if(a==="clearScores"){
    if(t.dataset.armed){clearAllScores();return}
    t.dataset.armed="1";t.textContent="Tap again to clear every score";$("#clearConfirm").textContent="You can undo this straight after.";return}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.g){const k=el.dataset.g;const v=S.scores[k]?[...S.scores[k]]:["",""];v[+el.dataset.i]=el.value===""?"":Math.max(0,Math.min(99,parseInt(el.value,10)||0));
    if(v[0]===""&&v[1]==="") delete S.scores[k]; else S.scores[k]=v;
    dirty.set(k,["scores",k]); document.querySelectorAll(`[data-g="${k}"]`).forEach(x=>x.classList.add("changed")); refreshSaveBar(); return}
  if(el.dataset.team){const t=S.teams[el.dataset.team]; if(el.dataset.p!=null) t.players[+el.dataset.p]=el.value; else t.name=el.value; dirty.set(el.id,["teams",el.dataset.team]); refreshSaveBar(); return}
  if(el.dataset.path){const parts=el.dataset.path.split("."); let o=S; for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
    const last=parts[parts.length-1]; o[last]=el.type==="number"?Math.max(0,parseInt(el.value,10)||0):el.value; dirty.set(el.id,parts[0]==="divisions"?["divisions"]:parts); refreshSaveBar(); return}
});
document.addEventListener("change",e=>{
  const el=e.target; if(el.dataset.court){S.courts[el.dataset.court]=+el.value;dirty.set(el.id,["courts",el.dataset.court]);render()}
  if(el.id==="csvFile"&&el.files&&el.files[0]){const f=el.files[0];
    (/\.xlsx$/i.test(f.name)?f.arrayBuffer().then(xlsxRows).then(importRows):f.text().then(csvImport))
      .catch(()=>{csvMsg="Couldn't read that file. Use the Excel template (.xlsx) or a CSV file.";render()})}
});

let wake=null;
async function onHash(){
  render();
  if(isTV()||scorerDiv()){try{wake=await navigator.wakeLock?.request("screen")}catch(e){}}
  else {try{await wake?.release()}catch(e){} wake=null}
}
window.addEventListener("hashchange",onHash);

/* tick: TV every second */
let lastPhase=JSON.stringify(phase());
setInterval(()=>{
  const p=phase(),ps=JSON.stringify({k:p.kind,r:p.round,g:p.game});
  if(isTV()){
    if(ps!==lastPhase){lastPhase=ps;render();return}
    const cd=$("#tvcd"); if(cd&&p.until&&p.kind!=="pre") cd.textContent=mmss(p.until-nowT());
    const ph=$(".tvphase"); if(ph&&p.kind==="game") ph.classList.toggle("low",p.until-nowT()<60000);
    const n=$("#tvnow"); if(n) n.textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  } else {
    const c2=$("#ctlcd"); if(c2&&p.until&&p.kind!=="pre") c2.textContent=mmss(p.until-nowT());
    if(ps!==lastPhase){lastPhase=ps; if(!dirty.size) render();}
  }
},1000);

/* boot */
{const seen=(S.dbSeen&&S.dbSeen[SID])||0; ss.set("dbq",JSON.stringify(dbQueue().filter(x=>x.n>seen)));}
onHash();
if(toastMsg){clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastMsg="";const t=$(".toast");t&&t.remove()},5000)}
startFirebase();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});

</script>
</body>
</html>
